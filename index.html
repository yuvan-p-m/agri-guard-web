<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232c6037'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/><path d='M12 8v8' stroke='white' stroke-width='2'/><path d='M8 12h8' stroke='white' stroke-width='2'/></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriGuard - AI-Powered Agricultural Health Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet">

  <style>
    /* Google Translate Widget & Banner Clean Styling */
    /* Hide top Google Translate banner frame & prevent body shift */
    .goog-te-banner-frame.skiptranslate,
    .goog-te-banner-frame,
    iframe.goog-te-banner-frame {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      width: 0 !important;
      opacity: 0 !important;
    }
    body {
      top: 0px !important;
      position: static !important;
    }
    /* Hide tooltip balloons & text highlights */
    #goog-gt-tt,
    .goog-te-balloon-frame {
      display: none !important;
      visibility: hidden !important;
    }
    .goog-text-highlight {
      background: none !important;
      box-shadow: none !important;
    }

    /* Style the Google Translate Widget container inside the navbar */
    #google_translate_element {
      display: inline-flex;
      align-items: center;
    }
    #google_translate_element .goog-te-gadget {
      font-family: inherit !important;
      font-size: 0px !important;
      color: transparent !important;
      display: inline-flex !important;
      align-items: center !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    #google_translate_element .goog-te-gadget .goog-te-combo {
      margin: 0 !important;
      padding: 4px 8px !important;
      border-radius: 8px !important;
      border: 1px solid #cbd5e1 !important;
      background-color: #ffffff !important;
      color: #0f172a !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      font-family: inherit !important;
      outline: none !important;
      cursor: pointer !important;
      transition: all 0.2s ease !important;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04) !important;
    }
    #google_translate_element .goog-te-gadget .goog-te-combo:hover,
    #google_translate_element .goog-te-gadget .goog-te-combo:focus {
      border-color: #2c6037 !important;
      box-shadow: 0 0 0 2px rgba(44, 96, 55, 0.12) !important;
    }
    #google_translate_element .goog-logo-link {
      display: none !important;
    }
  </style>

  <script type="text/javascript">
    // Sync initial Google Translate cookie from localStorage before widget initializes
    (function() {
      try {
        var saved = localStorage.getItem('agriguard_language') || localStorage.getItem('i18nextLng');
        if (saved && (saved === 'hi' || saved === 'ta' || saved === 'en')) {
          var val = '/en/' + saved;
          document.cookie = 'googtrans=' + val + '; path=/;';
          if (window.location.hostname && window.location.hostname.indexOf('.') !== -1) {
            document.cookie = 'googtrans=' + val + '; path=/; domain=.' + window.location.hostname + ';';
          }
        }
      } catch (e) {}
    })();

    // Google Translate Element Initialization (English, Hindi, Tamil only)
    function googleTranslateElementInit() {
      if (window.google && window.google.translate && window.google.translate.TranslateElement) {
        var container = document.getElementById('google_translate_element');
        if (container) {
          container.innerHTML = '';
        }
        new window.google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi,ta',
          autoDisplay: false
        }, 'google_translate_element');
      }
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<body class="bg-earth-50 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
